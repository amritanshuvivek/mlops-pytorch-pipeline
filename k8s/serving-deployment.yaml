apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: serving-container
          image: mlops-serve:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
              readOnly: true
            - name: checkpoints-volume
              mountPath: /app/checkpoints
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: checkpoints-pvc
            readOnly: true
      # Run as non-root user (matching Docker security standard)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
